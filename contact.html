<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact M.S.Suyo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="css/contact.css" />
  </head>
  <body>
    <div class="contact-page">
      <div class="contact-grid">

        <div class="contact-intro">
          <a href="index.html" class="back-link">
            <i class="bi bi-arrow-left" aria-hidden="true"></i> Back to Portfolio
          </a>

          <h1>CONTACT HER</h1>
          <p class="intro-text">
            Have a task in mind, a question, or just want to say hi?
            Feel free to send a message.
          </p>

          <div class="contact-info-list">
            <button type="button" class="contact-info-item" data-copy="mariahstefanie.edu@gmail.com" aria-label="Copy email address">
              <span class="contact-info-icon"><i class="bi bi-envelope-fill" aria-hidden="true"></i></span>
              <span class="contact-info-text">mariahstefanie.edu@gmail.com</span>
              <i class="bi bi-clipboard contact-info-action-icon" aria-hidden="true"></i>
            </button>

            <button type="button" class="contact-info-item" data-copy="+63 997 716 0333" aria-label="Copy phone number">
              <span class="contact-info-icon"><i class="bi bi-telephone-fill" aria-hidden="true"></i></span>
              <span class="contact-info-text">(+63) 997 716 0333</span>
              <i class="bi bi-clipboard contact-info-action-icon" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <div class="contact-form-panel">
          <form id="contactForm" class="row g-3">
            <div class="col-md-6">
              <label for="fullName" class="form-label">Full Name *</label>
              <input id="fullName" name="fullName" type="text" class="form-control" required />
            </div>

            <div class="col-md-6">
              <label for="email" class="form-label">Email Address *</label>
              <input id="email" name="email" type="email" class="form-control" required />
            </div>

            <div class="col-12">
              <label for="phone" class="form-label">Phone Number (Optional)</label>
              <input id="phone" name="phone" type="tel" class="form-control" />
            </div>

            <div class="col-12">
              <label for="message" class="form-label">Message *</label>
              <textarea id="message" name="message" class="form-control" rows="6" required></textarea>
            </div>

            <div class="col-12">
              <button type="submit" class="btn submit-btn w-100">Send Message</button>
            </div>
          </form>
        </div>

      </div>
    </div>

    <div class="page-decor-secondary" aria-hidden="true"></div>

    <div class="page-decor" aria-hidden="true"></div>

    <script src="js/contact.js"></script>
  </body>
</html>
